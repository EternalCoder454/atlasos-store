[workspace]
resolver = "3"
members = ["crates/atlas-store-core", "apps/atlas-store"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/EternalCoder454/atlasos-store"
rust-version = "1.89"

[workspace.dependencies]
# The atlas-framework crates (startup, settings, logging, crash reports,
# Flatpak); to move the pin, see CLAUDE.md. Atlas.Ui is not pinned here: it is
# the installed atlas-ui package.
atlas-framework-ui = { git = "https://github.com/EternalCoder454/atlas-framework", tag = "v1.4.0" }
atlas-framework-flatpak = { git = "https://github.com/EternalCoder454/atlas-framework", tag = "v1.4.0" }
log = { version = "0.4", features = ["std"] }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
