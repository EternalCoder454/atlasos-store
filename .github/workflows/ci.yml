name: CI

on:
  push:
    branches: [main, beta]
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One group per commit on main, so no run there is dropped while pending.
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  # Every run on main finishes, so each commit there has a result.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Actions and atlas-framework are pinned by commit (the tag in the comment):
  # a moved tag can't change what runs here.
  # atlas-framework's design rules (no default buttons, no QML file named
  # like a Telamon.Ui type), at the release the crates are pinned to.
  telamon:
    name: Telamon app checks
    uses: EternalCoder454/atlas-framework/.github/workflows/app-checks.yml@8e6a53569363aec3d7e42920875d03ca113ef3eb # v2.0.0
    with:
      framework-ref: 8e6a53569363aec3d7e42920875d03ca113ef3eb # v2.0.0

  # Telamon.Ui (telamon-ui), which the app builds against, is in no repository:
  # build atlas-framework's RPMs, at the release the crates are pinned to,
  # for the jobs below.
  # The RPMs are cached per pinned commit and month (a Fedora Qt update
  # gets fresh ones within a month), outside the checkout, which
  # actions/checkout would empty. Only runs on main write a cache other
  # refs read; the checksums catch a damaged entry.
  framework:
    name: atlas-framework RPMs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: registry.fedoraproject.org/fedora:44
    steps:
      - name: Tools for checkout and cache
        run: dnf -y install git-core tar zstd diffutils gawk
      - id: month
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /atlas-framework-rpms
          key: atlas-framework-rpms-f44-8e6a53569363aec3d7e42920875d03ca113ef3eb-${{ steps.month.outputs.month }}
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: EternalCoder454/atlas-framework
          ref: 8e6a53569363aec3d7e42920875d03ca113ef3eb # v2.0.0
      - name: Build the RPMs
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          packaging/build-rpm.sh /atlas-framework-rpms
          cd /atlas-framework-rpms && sha256sum -- *.rpm > SHA256SUMS
      - name: Check the cached RPMs
        if: steps.cache.outputs.cache-hit == 'true'
        run: |
          cd /atlas-framework-rpms
          sha256sum --strict -c SHA256SUMS
          # Nothing unlisted is uploaded either.
          diff <(ls -1 -- *.rpm) <(awk '{print $2}' SHA256SUMS | sort)
        shell: bash
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atlas-framework-rpms
          path: /atlas-framework-rpms/*.rpm
          if-no-files-found: error

  check:
    name: fmt, clippy, tests
    needs: framework
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container: registry.fedoraproject.org/fedora:44
    steps:
      - name: Tools for checkout and cache
        run: dnf -y install git-core tar zstd
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: atlas-framework-rpms
          # In the container: runner.temp would be the host's path.
          path: /tmp/atlas-framework-rpms
      - name: Build dependencies
        run: |
          dnf -y install dnf5-plugins clippy rustfmt \
            /tmp/atlas-framework-rpms/telamon-ui-[0-9]*.rpm \
            /tmp/atlas-framework-rpms/telamon-symbols-fonts-[0-9]*.rpm
          dnf -y builddep packaging/telamon-store.spec
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Only the downloads: an old target dir would grow without bound.
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-f44-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-f44-
      - name: Format
        run: cargo fmt --all --check
      # --locked: also fails when Cargo.lock and the atlas-framework rev disagree.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked

  rpm:
    name: RPM
    needs: framework
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container: registry.fedoraproject.org/fedora:44
    steps:
      - name: Tools for checkout
        run: dnf -y install git-core tar
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: atlas-framework-rpms
          # In the container: runner.temp would be the host's path.
          path: /tmp/atlas-framework-rpms
      - name: Build the RPM
        run: TELAMON_LOCAL_RPMS=/tmp/atlas-framework-rpms packaging/build-rpm.sh "$GITHUB_WORKSPACE/out"
      # The spec's %check has checked the binary in the build root; this looks
      # at the one in the package that is uploaded: position independent, full
      # RELRO (BIND_NOW), no executable stack, no text relocations, stack
      # protector, and no setuid/setgid or world-writable file in the package.
      - name: Check the package's hardening and modes
        run: |
          dnf -y install binutils cpio
          mkdir "/tmp/rpm-root"
          for rpm in out/*.rpm; do rpm2cpio "$rpm" | (cd "/tmp/rpm-root" && cpio -idm --quiet); done
          scripts/check-hardening.sh "/tmp/rpm-root/usr/bin/telamon-store"
          # Symbolic links are always rwxrwxrwx: they are not files that can be written.
          if find "/tmp/rpm-root" -type f \( -perm /6000 -o -perm -0002 \) -print | grep .; then
            echo "the package holds a setuid, setgid or world-writable file" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: telamon-store-rpm
          path: out/*.rpm
          if-no-files-found: error
