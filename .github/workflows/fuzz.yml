name: Fuzz

# The parsers of everything untrusted (the native-app manifests, catalog and
# GitHub answers, the desktop-entry rewrite, key files, .flatpakref and
# .flatpakrepo, URLs and launch arguments, the bundle unpacker, the AppImage
# ELF and squashfs readers and their metadata, AppStream XML), driven by
# libFuzzer with the invariants of
# crates/telamon-store-core/tests/harness/checks.rs, from the seeds in
# fuzz/corpus. A pull request that touches the crates or the fuzz targets
# runs every target for a short time; the weekly run goes longer. A crash
# fails the job and its input is uploaded as an artifact.
# (The property tests of the same invariants run in `cargo test`, in ci.yml.)
on:
  pull_request:
    paths: ['crates/**', 'fuzz/**', 'Cargo.lock', '.github/workflows/fuzz.yml']
  schedule:
    - cron: '41 5 * * 3'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: Fuzz the parsers
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container: registry.fedoraproject.org/fedora:44
    env:
      # Seconds per target; 18 targets: about 5 minutes on a pull request, 40 on the weekly run.
      FUZZ_SECONDS: ${{ github.event_name == 'pull_request' && '15' || '120' }}
      # libFuzzer and cargo-fuzz need a nightly compiler. Pinned to a date, so a
      # nightly regression does not turn this job red by itself; move it when
      # the toolchain moves.
      NIGHTLY: nightly-2026-10-08
      CARGO_FUZZ_VERSION: 0.13.2
      RUSTUP_HOME: /opt/rustup
      CARGO_HOME: /opt/cargo
    steps:
      - name: Tools
        run: |
          dnf -y install git-core cargo gcc gcc-c++ rustup flatpak-devel pkgconf-pkg-config tar xz
          rustup-init -y --profile minimal --default-toolchain "$NIGHTLY" --no-modify-path
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # The downloads, and the installed cargo-fuzz; not a target dir (it would grow without bound).
          path: |
            /opt/cargo/registry
            /opt/cargo/bin/cargo-fuzz
          key: fuzz-f44-${{ env.NIGHTLY }}-${{ env.CARGO_FUZZ_VERSION }}-${{ hashFiles('fuzz/Cargo.lock') }}
          restore-keys: fuzz-f44-${{ env.NIGHTLY }}-${{ env.CARGO_FUZZ_VERSION }}-
      - name: cargo-fuzz
        run: |
          export PATH="$CARGO_HOME/bin:$PATH"
          command -v cargo-fuzz >/dev/null || cargo install --locked "cargo-fuzz@$CARGO_FUZZ_VERSION"
      - name: Fuzz
        run: |
          export PATH="$CARGO_HOME/bin:$RUSTUP_HOME/toolchains/$NIGHTLY-x86_64-unknown-linux-gnu/bin:$PATH"
          fuzz/run.sh "$FUZZ_SECONDS"
      # The input that crashed a target, to run again with
      # `cargo fuzz run <target> <file>`.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: fuzz-crashes
          path: fuzz/work/artifacts
          if-no-files-found: ignore
