[package]
name = "telamon-store"
description = "Telamon Store: the app store of Telamon OS (Kirigami UI over CXX-Qt)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
build = "build.rs"

# CMake (Corrosion) links the static library into the C++ executable.
# `rlib` is there so `cargo test` and `cargo clippy` work as usual.
[lib]
name = "telamon_store"
crate-type = ["staticlib", "rlib"]

[dependencies]
telamon-framework-ui.workspace = true
telamon-store-core = { path = "../../crates/telamon-store-core" }
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = "0.10"
log.workspace = true
libflatpak.workspace = true
libc.workspace = true
serde_json.workspace = true
telamon-updater-core.workspace = true
zbus.workspace = true
tokio.workspace = true
futures-util.workspace = true

[features]
# Answers the native apps' GitHub requests from a folder of recorded answers
# (TELAMON_STORE_FAKE_GITHUB), for screenshots. Never enabled in a package.
fake-github = ["telamon-store-core/fake-github"]

[dev-dependencies]
telamon-store-core = { path = "../../crates/telamon-store-core", features = ["test-hooks"] }

[build-dependencies]
cxx-qt-build = "0.10"
