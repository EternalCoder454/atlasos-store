[package]
name = "telamon-store-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
description = "cargo-fuzz targets for the parsers of Telamon Store's core (not part of the workspace; needs nightly)"

[package.metadata]
cargo-fuzz = true

# Its own workspace and lock file: the fuzzer builds with sanitizers on
# nightly and must not change the application's Cargo.lock.
[workspace]

[dependencies]
libfuzzer-sys = "=0.4.13"
# The checks (tests/harness/checks.rs) use these besides the core crate.
libc = "0.2"
serde_json = "1"
quick-xml = { version = "0.42", default-features = false }
telamon-store-core = { path = "../crates/telamon-store-core" }
tar = { version = "0.4", default-features = false }
zstd = { version = "0.13", default-features = false }

[profile.release]
debug = 1
overflow-checks = true
panic = "unwind"

[[bin]]
name = "native_manifest"
path = "fuzz_targets/native_manifest.rs"
test = false
doc = false
bench = false

